name: docs

# Builds apps/docs, checks it in a browser, and publishes it to GitHub Pages.
# One-time setup: Settings → Pages → Source: GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let an in-progress one finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and check the docs site
    runs-on: ubuntu-latest
    env:
      # Project sites are served under /<repo>/. Set DOCS_BASE=/ for a custom domain.
      DOCS_BASE: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Turborepo builds the packages the site depends on (notably `sonorant`)
      # before the site itself.
      - run: npm run build
      # Render every route and drive the live demo against a fake microphone, so a
      # broken site never reaches Pages.
      - run: npx playwright install --with-deps chromium
      - run: npm run check:docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
