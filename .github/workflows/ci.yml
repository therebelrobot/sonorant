name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: wasm32-unknown-unknown
      - name: Build and test
        run: |
          cargo build --workspace --locked
          cargo test --workspace --locked
      # The pure crates must build for the browser target (TDD §1: one core, four targets).
      - name: Core and analysis build for wasm32
        run: cargo build -p sonorant-core -p sonorant-analysis -p sonorant-ffi --target wasm32-unknown-unknown --locked
      # Licence and advisory gate (S0.2, TDD §5). Reads deny.toml at the repo root.
      - name: Licence and advisory gate
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      # Advisory database check against Cargo.lock (S0.2, TDD §5).
      #
      # The repo pins Rust 1.88.0 (rust-toolchain.toml), which is older than the
      # current cargo-audit and will not compile it. This step only installs and
      # runs the tool, so it uses stable rather than the project's pinned compiler;
      # the project MSRV is unchanged.
      - name: Advisory audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          RUSTUP_TOOLCHAIN: stable

  node:
    name: Node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Type-check TypeScript sources
        run: npm run typecheck --workspaces --if-present
      # The release version lives in nine places; this fails if they disagree.
      - name: The release version agrees everywhere
        run: npm run check:release
      - run: npm run build
      # Egress origin scan + CSP check on the built bundle (S0.3, TDD §12).
      - run: npm run check:bundle
      - run: npm run test

  web:
    name: Web checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # Automated first-run / live / history / archive checks (phase 8).
      - run: npm run check:web
