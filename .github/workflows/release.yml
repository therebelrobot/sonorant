# Cuts a release, with exactly one human decision in it.
#
# A release starts with a human running the release script, which bumps every
# copy of the version, commits `chore(release): vX.Y.Z`, and pushes the commit
# and the tag to main:
#
#   npm run release:patch   # or release:minor / release:major
#
# On a push to main, this workflow does the rest: it recognises the release
# commit, builds and gates the artifacts, creates the GitHub Release, and hands
# off to publish.yml (npm + crates.io).
#
# It does NOT open release pull requests. It used to: on any push to main whose
# commits looked releasable it drafted a `chore(release): vX.Y.Z` PR. That
# looped — each merged release PR immediately produced another — because the
# "is this push the release PR?" test looked for the branch name in the merge
# commit *body*, where GitHub does not put it (the branch name is in the
# subject, the body is the PR title). With no tag ever created, `plan` saw
# unreleased commits every time and proposed a new bump forever. Deciding the
# bump by running the release script is where that judgement belonged anyway:
# `CORE_VERSION` is a *measurement* claim (TDD §9), and a conventional-commit
# bot can see that a `feat` happened but not whether a measure moved.
#
# Why release.yml does not just push a tag and let a second workflow notice:
# events raised by GITHUB_TOKEN do not trigger workflow runs. Pushing `v0.5.0`
# from here would build nothing and publish nothing, silently. `workflow_dispatch`
# is one of the two documented exceptions (repository_dispatch is the other), so
# the hand-off is explicit.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Plan the release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.decide.outputs.mode }}
      version: ${{ steps.decide.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Decide
        id: decide
        run: |
          set -euo pipefail
          version="$(node scripts/version.mjs get)"
          node scripts/version.mjs check

          subject="$(git log -1 --format=%s)"
          is_release_push=false
          # `npm run release:*` commits exactly `chore(release): vX.Y.Z`, so the
          # subject is the whole test. (A merge-commit branch-name check used to
          # live here; it never matched, and there is no release PR to merge now.)
          if printf '%s' "$subject" | grep -qE "^chore\(release\): v${version}\b"; then
            is_release_push=true
          fi

          if [ "$is_release_push" = true ]; then
            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
            echo "This push released ${version}."
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "Not a release commit; nothing to release."
          fi

  build:
    name: Build and attest
    needs: plan
    if: needs.plan.outputs.mode == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      # The native CLI binary is a release artifact. `npm run build` builds the web
      # bundle and the wasm wrapper but not the Rust binary, so build it here.
      # `docs/deployment.md` lists it as a build step for exactly this reason; the
      # "Package artifacts" step below tars `target/release/sonorant-cli`.
      - name: Build the native CLI (release)
        run: cargo build --release --locked -p sonorant-cli

      - name: Licence and advisory gate
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

      - name: Egress origin scan + CSP
        run: npm run check:bundle

      - name: Package artifacts
        env:
          REF_NAME: ${{ needs.plan.outputs.version }}
        run: |
          mkdir -p dist
          tar -czf "dist/sonorant-web-v${REF_NAME}.tar.gz" -C apps/web dist
          tar -czf "dist/sonorant-cli-v${REF_NAME}-x86_64-unknown-linux-gnu.tar.gz" \
            -C target/release sonorant-cli
          cp packages/sonorant/pkg/sonorant_ffi_bg.wasm "dist/sonorant_ffi_bg-v${REF_NAME}.wasm"
          (cd dist && sha256sum ./* > "SHA256SUMS-v${REF_NAME}.txt")
          ls -la dist

      - name: Software bill of materials
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/sbom.spdx.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dist/*"

      - uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  github-release:
    name: Create the GitHub Release
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist

      - name: Tag and release
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # `npm run release:*` already pushed the tag with the release commit, so
          # only create it when it is missing (a hand-made bump commit, say).
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "tag v${VERSION} already exists; leaving it as pushed."
          else
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.plan.outputs.version }}
          files: dist/*
          generate_release_notes: true
          draft: false # `release: published` fires for a human-made release, not for this one

  dispatch-publish:
    name: Publish to the registries
    needs: [plan, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      # workflow_dispatch, not a tag push: see the note at the top of this file.
      - name: Hand off to publish.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          # This job has no checkout, so `gh` has no local git repository to read the
          # owner/repo from and fails with "not a git repository". `--repo` supplies
          # it directly, which is why this job needs no checkout and only
          # `actions: write`.
          gh workflow run publish.yml --ref main --repo "${{ github.repository }}" \
            -f "tag=v${VERSION}"
          echo "publish.yml dispatched for v${VERSION}"
