[package]
name = "sonorant-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Batch analyser, conformance harness and fixture generator for the Sonorant voice analysis core (the internal native binary; the user-facing CLI is the npm sonorant-cli)."
repository.workspace = true
# Reserved on crates.io by the docs' naming policy (AGENTS.md §5): the crates.io
# sonorant-cli is internal, the npm sonorant-cli is the product. Publish neither.
publish = false

[dependencies]
hound = "3.5.1"
sonorant-analysis = { workspace = true }
sonorant-core = { workspace = true }

[dev-dependencies]
serde_json = "1.0.154"
