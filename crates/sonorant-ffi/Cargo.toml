[package]
name = "sonorant-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
# `cdylib` produces the browser `.wasm`; `rlib` keeps the native test target.
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1.0.154"
sonorant-analysis = { version = "0.1.0", path = "../sonorant-analysis" }
sonorant-archive = { version = "0.1.0", path = "../sonorant-archive" }
sonorant-core = { version = "0.1.0", path = "../sonorant-core" }
wasm-bindgen = "0.2.129"

[dev-dependencies]
serde_json = "1.0.154"
