[package]
name = "sonorant-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "wasm-bindgen surface for the Sonorant analysis core: a thin Engine with no acoustic logic."
repository.workspace = true

[lib]
# `cdylib` produces the browser `.wasm`; `rlib` keeps the native test target.
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1.0.154"
sonorant-analysis = { workspace = true }
sonorant-archive = { workspace = true }
sonorant-core = { workspace = true }
wasm-bindgen = "0.2.129"

[dev-dependencies]
serde_json = "1.0.154"
