[package]
name = "sonorant-archive"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Sonorant history export/import container, with AEAD (ChaCha20-Poly1305 over an Argon2id-derived key)."
repository.workspace = true

[dependencies]
argon2 = { version = "0.6.0", default-features = false, features = ["alloc"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
getrandom = { version = "0.2", features = ["js"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
zip = { version = "9.0.4", default-features = false }
