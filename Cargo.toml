# Cargo workspace root (TDD §3). The seven Rust crates in the monorepo.
[workspace]
resolver = "2"
members = [
    "crates/sonorant-core",
    "crates/sonorant-analysis",
    "crates/sonorant-calibrate",
    "crates/sonorant-archive",
    "crates/sonorant-ffi",
    "crates/sonorant-capture",
    "crates/sonorant-cli",
]

# Shared across every crate so CORE_VERSION stays aligned (TDD §9, §15).
[workspace.package]
version = "0.5.0"
edition = "2021"
license = "Unlicense"
repository = "https://github.com/therebelrobot/sonorant"

# Inter-crate dependencies live here so the release version is written once, by
# `scripts/version.mjs`, instead of in every dependent manifest. crates.io
# requires a path dependency to carry a version as well as a path, so these keep
# both; a crate references one with `{ workspace = true }`.
[workspace.dependencies]
sonorant-core = { path = "crates/sonorant-core", version = "0.5.0" }
sonorant-analysis = { path = "crates/sonorant-analysis", version = "0.5.0" }
sonorant-archive = { path = "crates/sonorant-archive", version = "0.5.0" }
